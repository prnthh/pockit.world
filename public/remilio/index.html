<!doctype html>
<!-- Static editor. Keep remilio.glb beside this HTML and serve public/ over HTTP.
Three.js is pinned to 0.184.0 from jsDelivr (internet required).
API references: https://threejs.org/docs/pages/GLTFLoader.html
https://threejs.org/docs/pages/GLTFExporter.html
https://github.com/vrm-c/vrm-specification/tree/master/specification/VRMC_vrm-1.0
https://threejs.org/docs/pages/OrbitControls.html
The blend is the source of truth; the GLB is a character export; Idle, Walk, and Run are embedded clips; additional previews load from FBX. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Remilio Maker</title>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
        }
      }
    </script>
    <link rel="stylesheet" href="/styles.css">
</head>
  <body class="remilio-page">
    <div class="page-scroll">
      <main class="window">
        <div class="titlebar">Remilio Maker</div>
        <input
          class="name"
          id="name"
          aria-label="Character name"
          placeholder="Character name"
          maxlength="48"
        />
        <div class="workspace">
          <section class="preview-frame" aria-label="Character preview">
            <div class="card" id="card">
              <canvas
                id="canvas"
                aria-label="Interactive 3D character. Drag to rotate and scroll to zoom."
              ></canvas>
              <div class="caption">
                <strong id="caption">Pockit Remilio</strong>
              </div>
              <div class="loading" id="loading">Loading…</div>
            </div>
            <p class="hint">Drag to rotate · Scroll to zoom</p>
          </section>
          <aside class="panel">
            <h1>Appearance</h1>
            <div class="field">
              <span class="label" id="animationLabel">Animation:</span>
              <div
                id="animation"
                class="button-row"
                role="group"
                aria-labelledby="animationLabel"
              >
                <button
                  type="button"
                  class="bevel"
                  data-animation=""
                  aria-pressed="true"
                  disabled
                >
                  T-pose
                </button>
              </div>
            </div>
            <div class="field">
              <span class="label">Blink preview:</span>
              <div class="button-row">
                <button class="bevel" id="blinkBoth" disabled>Blink</button
                ><button class="bevel" id="blinkLeft" disabled>Left</button
                ><button class="bevel" id="blinkRight" disabled>Right</button>
              </div>
            </div>
            <div class="field">
              <label for="skin">Skin color:</label>
              <div class="color-row">
                <input id="skin" type="color" value="#b84e4b" /><input
                  id="skinHex"
                  class="hex"
                  aria-label="Skin hex color"
                  value="#B84E4B"
                  maxlength="7"
                  pattern="#[0-9a-fA-F]{6}"
                />
              </div>
              <div
                id="skinSwatches"
                class="swatches"
                aria-label="Skin presets"
              ></div>
            </div>
            <div class="field">
              <label for="hair">Hair color:</label>
              <div class="color-row">
                <input id="hair" type="color" value="#a19b93" /><input
                  id="hairHex"
                  class="hex"
                  aria-label="Hair hex color"
                  value="#A19B93"
                  maxlength="7"
                  pattern="#[0-9a-fA-F]{6}"
                />
              </div>
              <div
                id="hairSwatches"
                class="swatches"
                aria-label="Hair presets"
              ></div>
            </div>
            <div class="field">
              <label for="angry">Angry: <output id="angryAmount">0%</output></label>
              <input id="angry" type="range" min="0" max="100" value="0" aria-label="Angry expression" />
            </div>
            <div class="field">
              <label for="top">Top:</label
              ><select id="top">
                <option value="none">None</option>
                <option value="tshirt" selected>T-shirt</option>
              </select>
            </div>
            <div class="field">
              <label for="headAccessory">Head accessory:</label
              ><select id="headAccessory">
                <option value="none">None</option>
                <option value="oni" selected>Oni horn</option>
              </select>
            </div>

            <div class="field">
              <span class="label" id="mouthLabel">Mouth shape:</span>
              <div
                id="mouthShapes"
                class="button-row"
                role="group"
                aria-labelledby="mouthLabel"
              ></div>
            </div>
            <div class="actions">
              <button class="bevel" id="random" disabled>Random</button
              ><button class="bevel" id="save" disabled>Save PNG</button
              ><button class="bevel" id="saveGlb" disabled>Save GLB</button
              ><button class="bevel" id="saveVrm" disabled>Save VRM</button
              ><button class="bevel reset" id="reset" disabled>
                Reset appearance
              </button>
            </div>
            <div class="status" id="status" role="status">
              Loading character…
            </div>
          </aside>
        </div>
        <input class="file" id="file" type="file" accept=".glb" />
      </main>
    </div>
    <script type="module" src="./maker.js"></script>
  </body>
</html>
